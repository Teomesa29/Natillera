<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pigBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff85a2" />
      <stop offset="50%" stop-color="#f72585" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>
    <linearGradient id="pigEar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9ebb" />
      <stop offset="100%" stop-color="#b5179e" />
    </linearGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="50%" stop-color="#ffb700" />
      <stop offset="100%" stop-color="#d48800" />
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff066" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0a0514" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Crown -->
  <path d="M 200,105 L 215,140 L 256,115 L 297,140 L 312,105 L 325,160 L 187,160 Z" fill="url(#crownGrad)" filter="url(#shadow)" />
  <circle cx="200" cy="100" r="7" fill="#ffe600" />
  <circle cx="256" cy="110" r="8" fill="#3b82f6" />
  <circle cx="312" cy="100" r="7" fill="#ffe600" />

  <!-- Back Ear -->
  <path d="M 170,165 Q 130,120 185,130 Z" fill="url(#pigEar)" />

  <!-- Piggy Body -->
  <circle cx="256" cy="280" r="145" fill="url(#pigBody)" filter="url(#shadow)" />

  <!-- Front Ear -->
  <path d="M 330,160 Q 380,115 335,135 Z" fill="url(#pigEar)" />

  <!-- Cheeks Glow -->
  <circle cx="190" cy="295" r="22" fill="#ff4d6d" opacity="0.4" filter="url(#glow)" />
  <circle cx="322" cy="295" r="22" fill="#ff4d6d" opacity="0.4" filter="url(#glow)" />

  <!-- Eyes Winking / Cute -->
  <ellipse cx="205" cy="245" rx="12" ry="16" fill="#0f172a" />
  <circle cx="201" cy="240" r="5" fill="#ffffff" />
  <circle cx="209" cy="250" r="2" fill="#ffffff" />

  <!-- Winking Right Eye -->
  <path d="M 295,245 Q 310,230 325,245" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />

  <!-- Snout / Nose -->
  <ellipse cx="256" cy="290" rx="45" ry="32" fill="#ff9ebb" filter="url(#shadow)" />
  <ellipse cx="240" cy="290" rx="9" ry="13" fill="#800f2f" />
  <ellipse cx="272" cy="290" rx="9" ry="13" fill="#800f2f" />

  <!-- Waving Paw / Arm (Saludando) -->
  <g class="waving-paw">
    <ellipse cx="380" cy="270" rx="28" ry="20" fill="url(#pigEar)" transform="rotate(-25 380 270)" filter="url(#shadow)" />
  </g>

  <!-- Gold Coin in Slot -->
  <ellipse cx="256" cy="142" rx="35" ry="10" fill="#0f172a" opacity="0.3" />
  <circle cx="256" cy="115" r="26" fill="url(#goldCoin)" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />
  <text x="256" y="123" font-family="'Outfit', sans-serif" font-weight="900" font-size="22" fill="#78350f" text-anchor="middle">$</text>
</svg>
