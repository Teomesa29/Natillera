<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Natillera Familiar</title>
    <link rel="icon" href="assets/images/piggy_logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/css/login.css">
</head>

<body>
    <!-- Canvas interactivo de estrellas -->
    <canvas id="starfield"></canvas>

    <div class="login-container">
        <!-- Izquierda: Formulario Glassmorphism Oscuro -->
        <div class="login-card">
            <div class="login-header">
                <div class="app-logo-badge">
                    <img src="assets/images/piggy_logo.svg" alt="Logo Natillera" class="piggy-brand-logo">
                    <span class="brand-title-badge">Natillera App</span>
                </div>
                <h1>🌟 INGRESAR</h1>
                <p>Inicia sesión en tu aventura</p>
            </div>

            <form class="login-form">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <div class="input-wrapper">
                        <i class="icon">👤</i>
                        <input type="text" id="usuario" name="usuario" placeholder="Tu usuario" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="icon">🔒</i>
                        <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="recordar">
                        <span class="checkmark"></span>
                        <span>Recordarme</span>
                    </label>
                </div>

                <button type="submit" class="btn-login">
                    <span>Ingresar</span>
                    <div class="btn-glow"></div>
                </button>

                <div id="mensaje" class="mensaje-error"></div>
                
                <div class="divider">
                    <span>¿Problemas para ingresar?</span>
                </div>
                
                <div class="forgot-container" style="text-align: center;">
                    <button type="button" class="btn-forgot-link" id="btnForgot">Recuperar contraseña</button>
                </div>
            </form>
        </div>

        <!-- Derecha: Cerdito Animado en Video MP4 Transparente -->
        <div class="info-box">
            <div class="piggy-badge-glow">
                <video id="videoPiggy" class="floating-image piggy-video-hero" autoplay loop muted playsinline>
                    <source src="assets/images/Cerdito.mp4" type="video/mp4">
                    Tu navegador no soporta reproducción de video.
                </video>
            </div>
            <div class="info-text">
                <h2>NATILLERA FAMILIAR</h2>
                <h3 class="glitch" data-text="DECEMBRINA">DECEMBRINA</h3>
            </div>
        </div>
    </div>

    <!-- Modal de Recuperar Contraseña -->
    <div class="modal-overlay hidden" id="forgotModal">
        <div class="modal-content glass-panel">
            <button type="button" class="btn-close" id="btnCloseModal">&times;</button>
            <h2 style="margin-bottom: 10px;">🌌 Recuperar Contraseña</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Ingresa tus datos para verificar tu identidad y restablecer tu contraseña.</p>
            
            <div class="form-group" style="margin-bottom: 15px;">
                <label>Correo Electrónico</label>
                <div class="input-wrapper">
                    <i class="icon">📧</i>
                    <input type="email" id="forgotEmail" placeholder="tu@correo.com">
                </div>
            </div>
            
            <div class="form-group" style="margin-bottom: 15px;">
                <label>Celular</label>
                <div class="input-wrapper">
                    <i class="icon">📱</i>
                    <input type="tel" id="forgotPhone" placeholder="Tu número">
                </div>
            </div>

            <div class="form-group hidden" id="newPasswordGroup" style="margin-bottom: 25px;">
                <label>Nueva Contraseña</label>
                <div class="input-wrapper">
                    <i class="icon">🔑</i>
                    <input type="password" id="forgotNewPassword" placeholder="Escribe la nueva contraseña">
                </div>
            </div>
            
            <button type="button" class="btn-login" id="btnSubmitForgot" style="width: 100%;">
                <span>Actualizar Contraseña</span>
                <div class="btn-glow"></div>
            </button>
            <div id="forgotMessage" class="mensaje-error"></div>
        </div>
    </div>

    <script src="assets/js/login.js"></script>
</body>

</html>
