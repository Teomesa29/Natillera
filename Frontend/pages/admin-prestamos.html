<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Préstamos</title>
    <link rel="icon" href="../assets/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/admin-prestamos.css" />
</head>

<body>
    <div class="container">

        <div class="header-dashboard">
            <h1>💰 Gestión de préstamos</h1>
            <div class="header-buttons">
                <button type="button" class="btn-volver" onclick="window.location.href='dashboard.html'">←
                    Volver</button>
                <button type="button" id="btnCerrarSesion" class="btn-cerrar-sesion">Cerrar Sesión</button>
            </div>
        </div>

        <section class="tarjeta">
            <div style="margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px;">
                <h2 style="font-size: 1.3rem; font-weight: 700; color: var(--text-main); margin: 0;">➕ Crear Nuevo Préstamo</h2>
                <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 4px;">Selecciona el socio y especifica las condiciones del crédito (monto, interés y plazo).</p>
            </div>

            <div class="admin-grid">
                <div class="form-group">
                    <label for="selectUsuario">Socio Prestamista</label>
                    <select id="selectUsuario"></select>
                </div>

                <div class="form-group">
                    <label for="monto">Monto Prestado (COP)</label>
                    <input id="monto" type="number" min="0" step="1000" placeholder="Ej: 500000" />
                </div>

                <div class="form-group">
                    <label for="interes">Interés Mensual (%)</label>
                    <input id="interes" type="number" min="0" step="0.1" placeholder="Ej: 3" />
                </div>

                <div class="form-group">
                    <label for="plazo">Plazo (meses)</label>
                    <input id="plazo" type="number" min="1" step="1" placeholder="Ej: 6" />
                </div>
            </div>

            <div class="acciones" style="margin-top: 25px; display: flex; gap: 15px; flex-wrap: wrap;">
                <button id="btnCrearPrestamo" type="button" class="btn-primary" style="margin-top:0;">
                    💵 Otorgar y Crear Préstamo
                </button>
                <button id="btnVerPrestamos" type="button" class="btn-secundario">
                    🔍 Ver Préstamos del Socio
                </button>
            </div>

            <div class="mensaje" id="mensaje"></div>
        </section>

        <section class="tarjeta" id="seccionPrestamosSocio">
            <h2>📋 Préstamos del socio</h2>
            <div id="listaPrestamos"></div>
        </section>

        <section class="tarjeta" id="seccionPlanPagos">
            <h2>📅 Plan de pagos (préstamo activo)</h2>
            <div id="planPagos"></div>
        </section>

    </div>

    <script src="../assets/js/admin-prestamos.js"></script>
    <script src="../assets/js/sesion.js"></script>

</body>

</html>
